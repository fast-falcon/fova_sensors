<!doctype html>
<html lang="fa" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fova - پنل پایش محیطی</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      height: 100%;
      overflow-y: auto;
      padding: 20px;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 1.8em;
      color: #3b82f6;
      font-weight: 600;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .panel {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
    }

    .panel-icon {
      font-size: 1.5em;
    }

    .panel-title {
      font-size: 1.2em;
      font-weight: 600;
      color: #1e293b;
      flex: 1;
    }

    .panel-type {
      background: #dbeafe;
      color: #3b82f6;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 500;
    }

    .comparison-section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 1.1em;
      font-weight: 600;
      color: #475569;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sensors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .sensor-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      border: 2px solid #e2e8f0;
    }

    .sensor-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .sensor-box-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1em;
      font-weight: 600;
      color: #1e293b;
    }

    .sensor-box-value {
      font-size: 1.5em;
      font-weight: 700;
      color: #3b82f6;
    }

    .chart-container {
      position: relative;
      height: 250px;
      margin: 20px 0;
    }

    .chart-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
    }

    .chart-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85em;
      padding: 4px 10px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .chart-label-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid;
    }

    .chart-label-text {
      font-weight: 500;
      color: #475569;
    }

    .device-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .device-pill {
      background: white;
      border: 2px solid;
      border-radius: 20px;
      padding: 8px 15px;
      font-size: 0.85em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-pill-name {
      font-weight: 600;
    }

    .system-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .system-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 2px solid;
    }

    .system-card.normal { border-color: #10b981; }
    .system-card.warning { border-color: #f59e0b; }
    .system-card.danger { border-color: #ef4444; }

    .circular-chart {
      width: 100px;
      height: 100px;
      margin: 10px auto;
      position: relative;
    }

    .circular-chart svg {
      transform: rotate(-90deg);
    }

    .circular-chart circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .circular-chart .bg-circle {
      stroke: #e2e8f0;
    }

    .circular-chart .progress-circle {
      stroke-dasharray: 251;
      stroke-dashoffset: 251;
      transition: stroke-dashoffset 0.5s ease;
    }

    .circular-chart-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .circular-value {
      font-size: 1.5em;
      font-weight: 700;
    }

    .circular-label {
      font-size: 0.75em;
      color: #64748b;
    }

    .system-card.normal .progress-circle { stroke: #10b981; }
    .system-card.warning .progress-circle { stroke: #f59e0b; }
    .system-card.danger .progress-circle { stroke: #ef4444; }

    .system-card.normal .circular-value { color: #10b981; }
    .system-card.warning .circular-value { color: #f59e0b; }
    .system-card.danger .circular-value { color: #ef4444; }

    .frequency-panel {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .frequency-value {
      text-align: center;
      font-size: 2.5em;
      font-weight: 700;
      color: #3b82f6;
      margin: 15px 0;
    }

    .frequency-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 100px;
      gap: 3px;
      margin: 20px 0;
    }

    .freq-bar {
      flex: 1;
      background: linear-gradient(to top, #3b82f6, #60a5fa);
      border-radius: 3px 3px 0 0;
      transition: height 0.3s ease;
      min-height: 10px;
    }

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80px;
      gap: 2px;
      margin: 15px 0;
    }

    .wave-bar {
      width: 4px;
      background: linear-gradient(to top, #3b82f6, #60a5fa);
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% { height: 15px; }
      50% { height: var(--wave-height); }
    }

    .error-history {
      background: #f8fafc;
      border-radius: 12px;
      padding: 15px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 15px;
    }

    .error-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: white;
      border-radius: 8px;
      border-right: 3px solid;
      font-size: 0.85em;
    }

    .error-item.danger { border-color: #ef4444; }
    .error-item.warning { border-color: #f59e0b; }
    .error-item.disconnected { border-color: #94a3b8; }

    .error-time {
      font-weight: 600;
      color: #3b82f6;
      min-width: 50px;
    }

    .error-sensor {
      flex: 1;
      color: #64748b;
    }

    .error-value {
      font-weight: 600;
    }

    .error-item.danger .error-value { color: #ef4444; }
    .error-item.warning .error-value { color: #f59e0b; }
    .error-item.disconnected .error-value { color: #94a3b8; }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .status-normal { background: #10b981; }
    .status-warning { background: #f59e0b; }
    .status-danger {
      background: #ef4444;
      animation: statusPulse 1.5s infinite;
    }
    .status-disconnected { background: #94a3b8; }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (max-width: 768px) {
      .sensors-grid {
        grid-template-columns: 1fr;
      }

      .system-metrics {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>

          }
        ],

        sensors: [

            history: generateInitialHistory(0.41, 0.2)
          }
        ],
        system: [
          { name: 'CPU', value: 48, threshold: { warning: 70, danger: 90 } },
          { name: 'RAM', value: 59, threshold: { warning: 75, danger: 90 } },
          { name: 'Inode', value: 42, threshold: { warning: 80, danger: 95 } },
          { name: 'Storage', value: 68, threshold: { warning: 80, danger: 90 } }
        ],
        frequency: {
          value: 1.9,
          history: generateInitialHistory(1.9, 0.65)
        }
      }
    ];

    environmentalBox.connectedDevices = equipmentBoxes.filter(b => b.connectedTo === environmentalBox.id);

    const errorHistory = [
      { time: '14:32', sensor: 'تجهیزات - سرور 2 - Storage', status: 'danger', value: '92%' },
      { time: '14:15', sensor: 'تجهیزات - سرور 1 - CPU', status: 'warning', value: '72%' },
      { time: '13:58', sensor: 'تجهیزات - سرور 2 - دما', status: 'disconnected', value: 'قطع' },
      { time: '13:20', sensor: 'باکس محیطی - Storage', status: 'warning', value: '78%' }
    ];

    let chartInstances = {};

    function getStatus(value, threshold, currentStatus) {
      if (currentStatus === 'disconnected') return 'disconnected';
      if (value >= threshold.danger) return 'danger';
      if (value >= threshold.warning) return 'warning';
      return 'normal';
    }

    function createBarChart(canvasId, sensorName, envSensor, eqSensors, unit) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      // حذ�� نمودار قبلی اگر و��ود دارد
      if (chartInstances[canvasId]) {
        chartInstances[canvasId].destroy();
      }

      const labels = Array(10).fill('').map((_, i) => `${9-i}×30s`);

      const datasets = [
        {
          label: 'محیطی (مرجع)',
          data: [...envSensor.history],
          backgroundColor: environmentalBox.color + '30',
          borderColor: environmentalBox.color,
          borderWidth: 3,
          tension: 0.4,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 6,
          borderDash: []
        }
      ];

      eqSensors.forEach((eqSensor, idx) => {
        datasets.push({
          label: eqSensor.deviceName,
          data: [...eqSensor.history],
          backgroundColor: eqSensor.color,
          borderColor: eqSensor.color,
          borderWidth: 2,
          tension: 0.4,
          fill: false,
          pointRadius: 0,
          pointHoverRadius: 6,
          borderDash: []
        });
      });

      chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              rtl: true,
              callbacks: {
                label: function(context) {
                  let label = context.dataset.label || '';
                  if (label) {
                    label += ': ';
                  }
                  const value = context.parsed.y;
                  if (unit === 'V') {
                    label += value.toFixed(2) + ' ' + unit;
                  } else {
                    label += Math.round(value) + ' ' + unit;
                  }
                  return label;
                }
              }
            }
          },
          scales: {
            x: {
              display: false
            },
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  if (unit === 'V') {
                    return value.toFixed(1);
                  }
                  return Math.round(value);
                }
              }
            }
          }
        }
      });
    }

    function renderSystemMetrics(system) {
      return system.map(metric => {
        const status = getStatus(metric.value, metric.threshold, 'normal');
        const circumference = 251;
        const offset = circumference - (metric.value / 100) * circumference;

        return `
          <div class="system-card ${status}">
            <div class="circular-chart">
              <svg width="100" height="100">
                <circle class="bg-circle" cx="50" cy="50" r="40"></circle>
                <circle class="progress-circle" cx="50" cy="50" r="40"
                        style="stroke-dashoffset: ${offset}"></circle>
              </svg>
              <div class="circular-chart-text">
                <div class="circular-value">${Math.round(metric.value)}</div>
                <div class="circular-label">%</div>
              </div>
            </div>
            <div class="system-label">${metric.name}</div>
          </div>
        `;
      }).join('');
    }

    function renderFrequencyComparison(envFreq, eqFreqs) {
      const canvasId = 'chart-frequency';
      const currentValue = envFreq.value.toFixed(1);

      const labelsHTML = `
        <div class="chart-labels">
          <div class="chart-label">
            <div class="chart-label-dot" style="border-color: ${environmentalBox.color}; background: ${environmentalBox.color}30;"></div>
            <span class="chart-label-text">${environmentalBox.name}</span>
          </div>
          ${eqFreqs.map(eq => `
            <div class="chart-label">
              <div class="chart-label-dot" style="border-color: ${eq.color};"></div>
              <span class="chart-label-text">${eq.deviceName}</span>
            </div>
          `).join('')}
        </div>
      `;

      return `
        <div class="sensor-box">
          <div class="sensor-box-header">
            <div class="sensor-box-title">
              <span style="font-size: 1.3em">🔊</span>
              <span>فرکانس صوتی</span>
            </div>
            <div class="sensor-box-value">
              ${currentValue} <span style="font-size: 0.6em">kHz</span>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="${canvasId}"></canvas>
          </div>
          ${labelsHTML}
        </div>
      `;
    }

    function createFrequencyChart(canvasId, envFreq, eqFreqs) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      if (chartInstances[canvasId]) {
        chartInstances[canvasId].destroy();
      }

      const labels = Array(10).fill('').map((_, i) => `${9-i}×30s`);

      const datasets = [
        {
          label: 'محیطی (مرجع)',
          data: [...envFreq.history],
          backgroundColor: environmentalBox.color + '30',
          borderColor: environmentalBox.color,
          borderWidth: 3,
          tension: 0.4,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 6,
          borderDash: []
        }
      ];

      eqFreqs.forEach((eqFreq) => {
        datasets.push({
          label: eqFreq.deviceName,
          data: [...eqFreq.history],
          backgroundColor: eqFreq.color,
          borderColor: eqFreq.color,
          borderWidth: 2,
          tension: 0.4,
          fill: false,
          pointRadius: 0,
          pointHoverRadius: 6,
          borderDash: []
        });
      });

      chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              rtl: true,
              callbacks: {
                label: function(context) {
                  let label = context.dataset.label || '';
                  if (label) {
                    label += ': ';
                  }
                  const value = context.parsed.y;
                  label += value.toFixed(1) + ' kHz';
                  return label;
                }
              }
            }
          },
          scales: {
            x: {
              display: false
            },
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return value.toFixed(1);
                }
              }
            }
          }
        }
      });
    }

    function renderErrorHistory() {
      const errorsHTML = errorHistory.map(error => `
        <div class="error-item ${error.status}">
          <div class="error-time">⏰ ${error.time}</div>
          <div class="error-sensor">${error.sensor}</div>
          <div class="error-value">${error.value}</div>
        </div>
      `).join('');

      return `<div class="error-history">${errorsHTML}</div>`;
    }

    function renderEnvironmentalBox(box) {
      const connectedDevices = box.connectedDevices || [];

      const devicePills = connectedDevices.map(device => `
        <div class="device-pill" style="border-color: ${device.color}">
          <span>${device.icon}</span>
          <span class="device-pill-name" style="color: ${device.color}">${device.name}</span>
        </div>
      `).join('');

      const sensorsHTML = box.sensors.map((envSensor, idx) => {
        const eqSensors = connectedDevices.map(device => ({
          ...device.sensors[idx],
          deviceName: device.name,
          color: device.color
        }));

        const canvasId = `chart-${idx}`;
        const currentValue = envSensor.status === 'disconnected' ? '--' :
                           (envSensor.unit === 'V' ? envSensor.value.toFixed(2) : Math.round(envSensor.value));

        const labelsHTML = `
          <div class="chart-labels">
            <div class="chart-label">
              <div class="chart-label-dot" style="border-color: ${environmentalBox.color}; background: ${environmentalBox.color}30;"></div>
              <span class="chart-label-text">${environmentalBox.name}</span>
            </div>
            ${eqSensors.map(eq => `
              <div class="chart-label">
                <div class="chart-label-dot" style="border-color: ${eq.color};"></div>
                <span class="chart-label-text">${eq.deviceName}</span>
              </div>
            `).join('')}
          </div>
        `;

        return `
          <div class="sensor-box">
            <div class="sensor-box-header">
              <div class="sensor-box-title">
                <span style="font-size: 1.3em">${envSensor.icon}</span>
                <span>${envSensor.name}</span>
              </div>
              <div class="sensor-box-value">
                ${currentValue} <span style="font-size: 0.6em">${envSensor.unit}</span>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="${canvasId}"></canvas>
            </div>
            ${labelsHTML}
          </div>
        `;
      }).join('');

      return `
        <div class="panel">
          <div class="panel-header">
            <span class="panel-icon">${box.icon}</span>
            <span class="panel-title">${box.name}</span>
            <span class="panel-type">باکس محیطی</span>
          </div>

          ${connectedDevices.length > 0 ? `
            <div class="section-title">
              🔗 تجهیزات متصل (${connectedDevices.length} ����تگاه)
            </div>
            <div class="device-pills">${devicePills}</div>
          ` : ''}

          <div class="comparison-section">
            <div class="section-title">📊 مقایسه سنسورها (5 دقیقه اخیر - هر 30 ثانیه)</div>
            <div class="sensors-grid">
              ${sensorsHTML}
            </div>
          </div>

          <div class="comparison-section">
            <div class="section-title">🔊 مقایسه فرکانس صوتی</div>
            <div class="sensors-grid" style="grid-template-columns: 1fr;">
              ${renderFrequencyComparison(box.frequency, connectedDevices.map(d => ({
                ...d.frequency,
                deviceName: d.name,
                color: d.color
              })))}
            </div>
          </div>

          <div class="comparison-section">
            <div class="section-title">💻 پارامترهای سیستمی</div>
            <div class="system-metrics">
              ${renderSystemMetrics(box.system)}
            </div>
          </div>

          ${renderErrorHistory()}
        </div>
      `;
    }

    function renderAll() {
      const mainGrid = document.getElementById('mainGrid');
      mainGrid.innerHTML = renderEnvironmentalBox(environmentalBox);

      // ایجاد نمودارها بعد از رندر HTML
      setTimeout(() => {
        environmentalBox.sensors.forEach((envSensor, idx) => {
          const eqSensors = environmentalBox.connectedDevices.map(device => ({
            ...device.sensors[idx],
            deviceName: device.name,
            color: device.color
          }));
          createBarChart(`chart-${idx}`, envSensor.name, envSensor, eqSensors, envSensor.unit);
        });

        // نمودار فرکانس
        const eqFreqs = environmentalBox.connectedDevices.map(device => ({
          ...device.frequency,
          deviceName: device.name,
          color: device.color
        }));
        createFrequencyChart('chart-frequency', environmentalBox.frequency, eqFreqs);
      }, 100);
    }

    async function onConfigChange(config) {
      document.getElementById('panelTitle').textContent = config.panel_title || defaultConfig.panel_title;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['panel_title', config.panel_title || defaultConfig.panel_title]
      ]);
    }

    renderAll();

    // به‌روزرسانی هر 3 ثانیه
    setInterval(() => {
      [environmentalBox, ...equipmentBoxes].forEach(box => {
        box.sensors.forEach(sensor => {
          if (sensor.status !== 'disconnected') {
            sensor.value += (Math.random() - 0.5) * (sensor.unit === 'V' ? 0.1 : 1);
            sensor.value = Math.max(0, sensor.value);
            sensor.status = getStatus(sensor.value, sensor.threshold, sensor.status);

            // به‌روزرسانی تاریخچه
            sensor.history.shift();
            sensor.history.push(sensor.value);
          }
        });

        box.system.forEach(metric => {
          metric.value += (Math.random() - 0.5) * 2;
          metric.value = Math.max(0, Math.min(100, metric.value));
        });

        // به‌روزرسانی فرکانس
        box.frequency.value += (Math.random() - 0.5) * 0.1;
        box.frequency.value = Math.max(0.5, Math.min(5, box.frequency.value));
        box.frequency.history.shift();
        box.frequency.history.push(box.frequency.value);
      });

      renderAll();
    }, 3000);

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
