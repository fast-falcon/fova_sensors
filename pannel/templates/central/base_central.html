<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس مرکزی{% endblock %}</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .shell-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.1);
      border: 1px solid #e2e8f0;
    }
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .nav a {
      padding: 8px 14px;
      border-radius: 999px;
      background: #f1f5f9;
      font-size: 13px;
      color: #0f172a;
      text-decoration: none;
      border: 1px solid #e2e8f0;
    }
    .nav a.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }
    a {
      color: #2563eb;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #475569;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: right;
    }
    th { background: #f8fafc; }
    {% block base_styles %}{% endblock %}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
  <div class="shell-card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 12px;">
      <div>
        <div class="title">{{ central.ident.cluster_name }}</div>
        <div class="subtitle">ID: {{ central.ident.box_id }}</div>
      </div>
      <div class="subtitle">پنل باکس مرکزی</div>
    </div>

    <div class="nav">
      <a href="{{ url_for('central_dashboard') }}"
         class="{% if request.path == '/' %}active{% endif %}">
        وضعیت کلی
      </a>
      <a href="{{ url_for('central_audio') }}"
         class="{% if '/audio' in request.path %}active{% endif %}">
        صداها
      </a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
