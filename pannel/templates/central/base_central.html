<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس مرکزی{% endblock %}</title>
  <style>
    *, *:before, *:after { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .shell-card {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
      border: 1px solid #1e293b;
    }
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .nav a {
      padding: 8px 14px;
      border-radius: 999px;
      background: #1e293b;
      font-size: 13px;
      color: #e2e8f0;
      text-decoration: none;
      border: 1px solid #334155;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .nav a.active {
      background: #3b82f6;
      color: #0f172a;
      border-color: #2563eb;
    }
    a { color: #2563eb; }
    a:hover { color: #1d4ed8; }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .card h2, .card h3 { margin: 0 0 12px 0; color: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .badge.online { background: #ecfdf3; color: #15803d; border-color: #bbf7d0; }
    .badge.offline { background: #f8fafc; color: #475569; border-color: #cbd5e1; }
    .badge.normal { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
    .badge.warn { background: #fffbeb; color: #f59e0b; border-color: #fef3c7; }
    .badge.alert { background: #fef2f2; color: #b91c1c; border-color: #fecdd3; }
    .badge.unknown { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    audio { width: 100%; }
    .flex-row { display:flex; flex-wrap:wrap; gap:12px; }
    .flex-col { flex:1 1 280px; }
    .header-meta { font-size:12px; color:#cbd5e1; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
  <div class="shell-card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <div style="font-size:20px; font-weight:bold;">
          {{ central.ident.cluster_name }}
        </div>
        <div class="header-meta">شناسه: {{ central.ident.box_id }}</div>
      </div>
      <div style="font-size:13px; opacity:0.9;">
        پنل باکس مرکزی
      </div>
    </div>

    <div class="nav">
      <a href="{{ url_for('central_dashboard') }}"
         class="{% if request.path == '/' %}active{% endif %}">
        وضعیت کلی
      </a>
      <a href="{{ url_for('central_audio') }}"
         class="{% if '/audio' in request.path %}active{% endif %}">
        صداها
      </a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
