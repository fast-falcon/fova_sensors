<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس مرکزی{% endblock %}</title>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      background: #020617;
      color: #f9fafb;
      margin: 0;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: #020617;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      border: 1px solid #1f2937;
    }
    .nav {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .nav a {
      padding: 6px 12px;
      border-radius: 999px;
      background: #111827;
      font-size: 13px;
      color: #e5e7eb;
      text-decoration: none;
    }
    .nav a.active {
      background: #10b981;
      color: #111827;
    }
    a {
      color: #10b981;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #1f2937;
    }
    th {
      background: #020617;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
    }
    .badge.online { background: #16a34a; color: #022c22; }
    .badge.offline { background: #6b7280; color: #020617; }
    .badge.normal { background: #10b981; color: #052e16; }
    .badge.warn { background: #facc15; color: #1f2937; }
    .badge.alert { background: #ef4444; color: #111827; }
    .badge.unknown { background: #4b5563; }
    audio { width: 100%; }
    .flex-row { display:flex; flex-wrap:wrap; gap:12px; }
    .flex-col { flex:1 1 260px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:18px; font-weight:bold;">
          {{ central.ident.cluster_name }}
        </div>
        <div style="font-size:12px; opacity:0.8;">
          ID: {{ central.ident.box_id }}
        </div>
      </div>
      <div style="font-size:11px; opacity:0.7;">
        پنل باکس مرکزی
      </div>
    </div>

    <div class="nav">
      <a href="{{ url_for('central_dashboard') }}"
         class="{% if request.path == '/' %}active{% endif %}">
        وضعیت کلی
      </a>
      <a href="{{ url_for('central_audio') }}"
         class="{% if '/audio' in request.path %}active{% endif %}">
        صداها
      </a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
