<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس مرکزی{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 18px;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .layout {
      max-width: 1600px;
      margin: 0 auto;
    }
    .top-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    .top-card h1 { font-size: 1.4em; margin-bottom: 6px; color: #1e293b; }
    .top-sub { color: #475569; font-size: 0.9em; }
    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .nav a {
      padding: 8px 14px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 0.9em;
      border: 1px solid transparent;
    }
    .nav a.active {
      background: #2563eb;
      color: white;
      border-color: #1d4ed8;
      box-shadow: 0 2px 10px rgba(37,99,235,0.3);
    }
    .content-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 700;
    }
    .badge.online { background: #ecfdf3; color: #15803d; border: 1px solid #bbf7d0; }
    .badge.offline { background: #f8fafc; color: #475569; border: 1px solid #cbd5e1; }
    .badge.alert { background: #fef2f2; color: #dc2626; border: 1px solid #fecdd3; }
    .badge.warn { background: #fffbeb; color: #b45309; border: 1px solid #fef08a; }
    .badge.unknown { background: #e2e8f0; color: #475569; border: 1px solid #cbd5e1; }
    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
    .grid.sensors { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="layout">
    <div class="top-card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <div>
          <h1>{{ central.ident.cluster_name }}</h1>
          <div class="top-sub">ID: {{ central.ident.box_id }} · پنل باکس مرکزی</div>
        </div>
        <div class="badge online">فعال</div>
      </div>
      <div class="nav">
        <a href="{{ url_for('central_dashboard') }}" class="{% if request.path == '/' %}active{% endif %}">وضعیت کلی</a>
        <a href="{{ url_for('central_audio') }}" class="{% if '/audio' in request.path %}active{% endif %}">صداها</a>
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
