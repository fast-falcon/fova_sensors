<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس مرکزی{% endblock %}</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --muted: #475569;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #0f172a;
      margin: 0;
      padding: 0;
      direction: rtl;
    }

    .page { max-width: 1800px; margin: 0 auto; padding: 20px 16px 40px; }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
      margin-bottom: 16px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      color: var(--primary);
    }

    .top-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    .nav {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: #0f172a;
      font-size: 13px;
      background: #f1f5f9;
    }

    .nav a.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      padding: 18px;
      margin-top: 16px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 17px;
      color: #0f172a;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }

    th {
      background: #f8fafc;
      color: var(--muted);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge.online { background: rgba(16,185,129,0.16); color: #0f5132; border: 1px solid rgba(16,185,129,0.4); }
    .badge.offline { background: #e2e8f0; color: #475569; border: 1px solid #cbd5e1; }
    .badge.warn { background: rgba(245,158,11,0.18); color: #78350f; border: 1px solid rgba(245,158,11,0.45); }
    .badge.alert { background: rgba(239,68,68,0.14); color: #7f1d1d; border: 1px solid rgba(239,68,68,0.4); }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .kpi {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .kpi .label { color: var(--muted); font-size: 12px; }
    .kpi .value { font-size: 20px; font-weight: 700; color: #0f172a; }

    .chart-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #f8fafc;
    }

    .chart-title {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 12px;
      background: #eef2ff;
      color: #312e81;
      border: 1px solid #c7d2fe;
      font-size: 12px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>{{ central.ident.cluster_name }}</h1>
      <div class="top-meta">
        <span>شناسه: {{ central.ident.box_id }}</span>
        <span class="pill">باکس مرکزی</span>
      </div>
      <div class="nav">
        <a href="{{ url_for('central_dashboard') }}" class="{% if request.path == '/' %}active{% endif %}">داشبورد</a>
        <a href="{{ url_for('central_audio') }}" class="{% if '/audio' in request.path %}active{% endif %}">صداها</a>
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
