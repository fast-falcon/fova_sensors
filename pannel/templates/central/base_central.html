<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس مرکزی{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }
    .hero {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hero-title { font-size: 1.5em; font-weight: 700; color: #2563eb; }
    .hero-sub { color: #475569; font-size: 0.95em; }
    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .nav a {
      padding: 8px 14px;
      border-radius: 14px;
      text-decoration: none;
      color: #0f172a;
      background: #e2e8f0;
      font-size: 0.9em;
      border: 1px solid transparent;
    }
    .nav a.active { background: #2563eb; color: #ffffff; border-color: #1d4ed8; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.85em; }
    .badge.online { background: #dcfce7; color: #15803d; }
    .badge.offline { background: #e2e8f0; color: #334155; }
    .badge.alert { background: #fee2e2; color: #b91c1c; }
    .badge.warn { background: #fef9c3; color: #92400e; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="container">
    <div class="card hero">
      <div>
        <div class="hero-title">{{ central.ident.cluster_name }}</div>
        <div class="hero-sub">شناسه: {{ central.ident.box_id }}</div>
      </div>
      <div class="nav">
        <a href="{{ url_for('central_dashboard') }}" class="{% if request.path == '/' %}active{% endif %}">داشبورد</a>
        <a href="{{ url_for('central_audio') }}" class="{% if '/audio' in request.path %}active{% endif %}">صداها</a>
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
