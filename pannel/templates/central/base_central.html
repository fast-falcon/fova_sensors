<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس مرکزی{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IRANSans", "Vazir", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #0b1220);
      color: #0f172a;
      direction: rtl;
      padding: 18px;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    .card {
      background: #f8fafc;
      border-radius: 18px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.22);
      border: 1px solid #e2e8f0;
    }
    .card.dark {
      background: #0b1220;
      color: #e2e8f0;
      border-color: #1f2937;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #0ea5e9;
    }
    .subtitle { color: #475569; font-size: 13px; }
    .nav { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .nav a {
      padding: 8px 14px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .nav a.active { background: #0ea5e9; color: #f8fafc; box-shadow: 0 0 0 3px #bae6fd; }
    a { color: #0ea5e9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th { background: #f1f5f9; color: #0f172a; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge.online { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .badge.offline { background: #f8fafc; color: #64748b; border: 1px solid #cbd5e1; }
    .badge.unknown { background: #e2e8f0; color: #0f172a; }
    .badge.warn { background: #fef9c3; color: #854d0e; border: 1px solid #fcd34d; }
    .badge.alert { background: #fee2e2; color: #b91c1c; border: 1px solid #fecdd3; }
    .badge.normal { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    .muted { color: #94a3b8; }
    .grid { display: grid; gap: 14px; }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .chip { padding: 8px 12px; background: #e2e8f0; border-radius: 12px; font-weight: 600; color: #0f172a; }
    .metric { font-size: 24px; font-weight: 800; color: #0ea5e9; }
    .progress {
      width: 100%; height: 10px; border-radius: 999px; background: #e2e8f0;
      overflow: hidden; margin-top: 6px;
    }
    .progress span { display: block; height: 100%; border-radius: inherit; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <div>
        <div class="title">{{ central.ident.cluster_name }}</div>
        <div class="subtitle">ID: {{ central.ident.box_id }}</div>
      </div>
      <div class="chip">پنل باکس مرکزی</div>
    </div>

    <div class="nav">
      <a href="{{ url_for('central_dashboard') }}" class="{% if request.path == '/' %}active{% endif %}">وضعیت کلی</a>
      <a href="{{ url_for('central_audio') }}" class="{% if '/audio' in request.path %}active{% endif %}">صداها</a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
