<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}سنسور محیطی{% endblock %}</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .nav a {
      padding: 8px 14px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      font-size: 13px;
    }
    .nav a.active { background: #22c55e; color: #ffffff; border-color: #22c55e; }
    .title { font-size: 20px; font-weight: 700; color: #1e293b; }
    .subtitle { font-size: 12px; color: #475569; }
    {% block base_styles %}{% endblock %}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 12px;">
      <div>
        <div class="title">{{ ident.sensor_name }}</div>
        <div class="subtitle">ID: {{ ident.box_id }}</div>
      </div>
      <div class="subtitle">پنل باکس سنسور</div>
    </div>

    <div class="nav">
      <a href="{{ url_for('sensor_dashboard') }}"
         class="{% if request.path == '/' %}active{% endif %}">
        وضعیت
      </a>
      <a href="{{ url_for('sensor_audio_list') }}"
         class="{% if '/audio' in request.path %}active{% endif %}">
        صداها
      </a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
