<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}پنل سنسور{% endblock %}</title>
  <style>
    *, *:before, *:after { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .shell-card {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
      border: 1px solid #1e293b;
    }
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .nav a {
      padding: 8px 14px;
      border-radius: 999px;
      background: #1e293b;
      font-size: 13px;
      color: #e2e8f0;
      text-decoration: none;
      border: 1px solid #334155;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .nav a.active {
      background: #22d3ee;
      color: #0f172a;
      border-color: #0ea5e9;
    }
    a { color: #0ea5e9; }
    a:hover { color: #0284c7; }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .card h2, .card h3 { margin: 0 0 12px 0; color: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .badge.crit { background: #fef2f2; color: #b91c1c; border-color: #fecdd3; }
    .badge.warn { background: #fffbeb; color: #f59e0b; border-color: #fef3c7; }
    audio { width: 100%; }
    .header-meta { font-size:12px; color:#cbd5e1; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
  <div class="shell-card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <div style="font-size:20px; font-weight:bold;">
          {{ ident.sensor_name }}
        </div>
        <div class="header-meta">شناسه: {{ ident.box_id }}</div>
      </div>
      <div style="font-size:13px; opacity:0.9;">
        پنل باکس سنسور
      </div>
    </div>

    <div class="nav">
      <a href="{{ url_for('sensor_dashboard') }}"
         class="{% if request.path == '/' %}active{% endif %}">
        وضعیت کلی
      </a>
      <a href="{{ url_for('sensor_audio_list') }}"
         class="{% if '/audio' in request.path %}active{% endif %}">
        صداها
      </a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
