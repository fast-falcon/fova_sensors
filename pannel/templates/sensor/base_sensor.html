<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}سنسور محیطی{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IRANSans", "Vazir", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #0b1220);
      color: #0f172a;
      padding: 18px;
      direction: rtl;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .card {
      background: #f8fafc;
      border-radius: 18px;
      padding: 18px;
      margin-top: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.22);
    }
    a { color: #0ea5e9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .nav a { padding: 8px 14px; border-radius: 999px; background: #e2e8f0; color: #0f172a; font-size: 13px; font-weight: 600; }
    .nav a.active { background: #0ea5e9; color: #f8fafc; box-shadow: 0 0 0 3px #bae6fd; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge.ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .badge.warn { background: #fef9c3; color: #854d0e; border: 1px solid #fcd34d; }
    .badge.crit { background: #fee2e2; color: #b91c1c; border: 1px solid #fecdd3; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th { background: #f1f5f9; color: #0f172a; }
    audio { width: 100%; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title { font-size: 21px; font-weight: 800; color: #0ea5e9; }
    .subtitle { color: #475569; font-size: 13px; }
    .chip { padding: 8px 12px; background: #e2e8f0; border-radius: 12px; font-weight: 600; color: #0f172a; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <div>
        <div class="title">{{ ident.sensor_name }}</div>
        <div class="subtitle">ID: {{ ident.box_id }}</div>
      </div>
      <div class="chip">پنل باکس سنسور</div>
    </div>

    <div class="nav">
      <a href="{{ url_for('sensor_dashboard') }}" class="{% if request.path == '/' %}active{% endif %}">وضعیت</a>
      <a href="{{ url_for('sensor_audio_list') }}" class="{% if '/audio' in request.path %}active{% endif %}">صداها</a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>
</body>
</html>
