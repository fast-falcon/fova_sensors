<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}باکس سنسور{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; color: #0f172a; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .hero { display: flex; flex-direction: column; gap: 8px; }
    .hero-title { font-size: 1.4em; font-weight: 700; color: #2563eb; }
    .hero-sub { color: #475569; font-size: 0.95em; }
    .nav { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .nav a { padding: 8px 14px; border-radius: 14px; text-decoration: none; background: #e2e8f0; color: #0f172a; font-size: 0.9em; border: 1px solid transparent; }
    .nav a.active { background: #2563eb; color: #ffffff; border-color: #1d4ed8; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.85em; }
    .badge.ok { background: #dcfce7; color: #15803d; }
    .badge.warn { background: #fef9c3; color: #92400e; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="container">
    <div class="card hero">
      <div class="hero-title">{{ ident.sensor_name }}</div>
      <div class="hero-sub">شناسه: {{ ident.box_id }}</div>
      <div class="nav">
        <a href="{{ url_for('sensor_dashboard') }}" class="{% if request.path == '/' %}active{% endif %}">داشبورد</a>
        <a href="{{ url_for('sensor_audio_list') }}" class="{% if '/audio' in request.path %}active{% endif %}">صداها</a>
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
