<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}ویزارد راه‌اندازی{% endblock %}</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --border: #e2e8f0;
      --muted: #475569;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #0f172a; }
    .page { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 2px 12px rgba(15,23,42,0.06); }
    h1 { margin: 0 0 8px; color: var(--primary); font-size: 20px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p { color: var(--muted); }
    label { display: block; margin: 8px 0 4px; font-weight: 600; color: #0f172a; }
    input[type="text"], input[type="number"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: #f8fafc; }
    button { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 700; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    .alert { color: #b91c1c; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); padding: 10px 12px; border-radius: 10px; margin: 8px 0; }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
