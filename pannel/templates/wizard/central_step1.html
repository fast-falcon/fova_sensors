<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>پیکربندی مرکزی - گام ۱</title>
  <style>
    body { font-family:'Segoe UI', Tahoma, sans-serif; background:#f8fafc; color:#0f172a; margin:0; padding:30px; }
    .card { max-width: 720px; margin: 0 auto; background:white; padding:22px; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.08); border:1px solid #e2e8f0; }
    h1 { margin-bottom: 12px; color:#1e293b; }
    .field { margin:12px 0; }
    label { display:block; margin-bottom:6px; font-weight:700; color:#334155; }
    input { width: 100%; padding:10px; border-radius:10px; border:1px solid #e2e8f0; background:#f8fafc; }
    .button { margin-top:14px; padding:10px 16px; background:#2563eb; color:white; border:none; border-radius:10px; cursor:pointer; font-size:0.95em; }
    .button:hover { background:#1d4ed8; }
    .errors { background:#fef2f2; border:1px solid #fecdd3; color:#b91c1c; padding:10px 12px; border-radius:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>گام ۱: اطلاعات اولیه مرکزی</h1>
    {% if errors %}
      <ul class="errors">
        {% for err in errors %}<li>{{ err }}</li>{% endfor %}
      </ul>
    {% endif %}
    <form method="post">
      <div class="field">
        <label>نام مجموعه (Cluster):</label>
        <input type="text" name="cluster_name" value="{{ cluster_name }}" required />
      </div>
      <div class="field">
        <label>SSID هات‌اسپات:</label>
        <input type="text" name="hotspot_ssid" value="{{ hotspot_ssid }}" required />
      </div>
      <div class="field">
        <label>رمز هات‌اسپات:</label>
        <input type="password" name="hotspot_password" value="{{ hotspot_password }}" required />
      </div>
      <button class="button" type="submit">تایید و ادامه</button>
    </form>
  </div>
</body>
</html>
