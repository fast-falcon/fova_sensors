<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>پیکربندی مرکزی - مرحله ۱</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
    .container { max-width: 760px; margin: 0 auto; padding: 28px; }
    .card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(15,23,42,0.08); border: 1px solid #e2e8f0; }
    h1 { margin-top: 0; font-size: 22px; color: #1e293b; }
    label { display: block; margin-bottom: 10px; color: #0f172a; font-weight: 600; }
    input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc; }
    .actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px; }
    button { background: #22c55e; color: #ffffff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    button:hover { opacity: 0.95; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>مرحله ۱: اطلاعات پایه مرکزی</h1>
      <form method="post">
        <label>نام خوشه:
          <input name="cluster_name" value="{{ defaults.cluster_name }}" required />
        </label>
        <label>شناسه باکس مرکزی:
          <input name="box_id" value="{{ defaults.box_id }}" required />
        </label>
        <div class="actions">
          <button type="submit">ادامه</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
