<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>پیکربندی مرکزی - گام ۲</title>
  <style>
    body { font-family: "IRANSans", "Vazir", "Segoe UI", sans-serif; background: linear-gradient(135deg,#0f172a,#0b1220); color:#0f172a; margin:0; padding:20px; }
    .container { max-width: 720px; margin: 0 auto; }
    .card { background:#f8fafc; border-radius:16px; padding:20px; box-shadow:0 12px 30px rgba(15,23,42,0.25); border:1px solid #e2e8f0; }
    h1 { margin-top:0; color:#0ea5e9; font-size:22px; }
    label { display:block; margin:10px 0 6px; font-weight:700; color:#0f172a; }
    input { width:100%; padding:10px; border-radius:10px; border:1px solid #cbd5e1; font-size:14px; }
    button { margin-top:14px; background:#0ea5e9; color:#f8fafc; border:none; padding:10px 18px; border-radius:12px; font-weight:700; cursor:pointer; }
    button:hover { background:#0284c7; }
    .errors { background:#fee2e2; color:#b91c1c; border:1px solid #fecdd3; border-radius:10px; padding:10px; margin-bottom:12px; }
    .hint { color:#475569; font-size:12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>گام ۲: اتصال به سرور اصلی</h1>
      {% if errors %}
        <ul class="errors">
          {% for err in errors %}<li>{{ err }}</li>{% endfor %}
        </ul>
      {% endif %}
      <form method="post">
        <label>آدرس سرور اصلی:</label>
        <input type="text" name="server_host" value="{{ server_host }}" required />

        <label>پورت سوکت سرور:</label>
        <input type="number" name="server_socket_port" value="{{ server_socket_port }}" required />

        <label>پورت HTTP سرور:</label>
        <input type="number" name="server_http_port" value="{{ server_http_port }}" required />

        <label>بازه ضبط صدا (ثانیه):</label>
        <input type="number" name="audio_segment_seconds" value="{{ audio_segment_seconds }}" min="1" required />

        <label>اتصال آنلاین به سرور اصلی:</label>
        <div class="hint" style="margin-bottom:6px;">
          <input type="checkbox" name="online_enabled" {% if online_enabled %}checked{% endif %} /> فعال باشد
        </div>
        <div class="hint">در صورت غیرفعال کردن، باکس مرکزی فقط محلی کار می‌کند.</div>

        <button type="submit">تایید و ادامه</button>
      </form>
    </div>
  </div>
</body>
</html>
