<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>پیکربندی مرکزی - گام ۲</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
    .container { max-width: 760px; margin: 0 auto; padding: 28px; }
    .card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(15,23,42,0.08); border: 1px solid #e2e8f0; }
    h1 { margin-top: 0; font-size: 22px; color: #1e293b; }
    label { display: block; margin-bottom: 8px; color: #0f172a; font-weight: 600; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc; }
    .field { margin-bottom: 12px; }
    .actions { margin-top: 16px; display: flex; justify-content: flex-end; }
    button { background: #22c55e; color: #ffffff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    button:hover { opacity: 0.95; }
    .errors { background: #fee2e2; border: 1px solid #fecdd3; color: #7f1d1d; padding: 10px 12px; border-radius: 12px; margin-bottom: 12px; }
    .inline { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>گام ۲: اتصال به سرور اصلی</h1>
      {% if errors %}
        <div class="errors"><ul>{% for err in errors %}<li>{{ err }}</li>{% endfor %}</ul></div>
      {% endif %}
      <form method="post">
        <div class="field">
          <label>آدرس سرور اصلی</label>
          <input type="text" name="server_host" value="{{ server_host }}" required />
        </div>
        <div class="field">
          <label>پورت سوکت سرور</label>
          <input type="number" name="server_socket_port" value="{{ server_socket_port }}" required />
        </div>
        <div class="field">
          <label>پورت HTTP سرور</label>
          <input type="number" name="server_http_port" value="{{ server_http_port }}" required />
        </div>
        <div class="field">
          <label>بازه ضبط صدا (ثانیه)</label>
          <input type="number" name="audio_segment_seconds" value="{{ audio_segment_seconds }}" min="1" required />
        </div>
        <div class="field inline">
          <input type="checkbox" name="online_enabled" {% if online_enabled %}checked{% endif %} />
          <span>اتصال آنلاین به سرور اصلی (در صورت غیرفعال شدن، عملکرد فقط محلی است)</span>
        </div>
        <div class="actions"><button type="submit">تایید و ادامه</button></div>
      </form>
    </div>
  </div>
</body>
</html>
