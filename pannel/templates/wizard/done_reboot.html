<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>در حال ریبوت</title>
  <style>
    body { margin:0; font-family:'Segoe UI', Tahoma, sans-serif; background:#f8fafc; color:#0f172a; direction:rtl; }
    .container { max-width:520px; margin:40px auto; padding:20px; }
    .card { background:#ffffff; border:1px solid #e2e8f0; border-radius:16px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.06); text-align:center; }
    h1 { margin:0 0 12px 0; font-size:22px; }
    p { color:#475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>ریستارت دستگاه</h1>
      <p>تنظیمات {{ 'مرکزی' if role == 'central' else 'سنسور' }} ذخیره شد. دستگاه به زودی ریبوت می‌شود.</p>
    </div>
  </div>
</body>
</html>
