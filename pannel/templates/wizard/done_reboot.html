<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>در حال ریبوت</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
    .container { max-width: 760px; margin: 0 auto; padding: 28px; }
    .card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(15,23,42,0.08); border: 1px solid #e2e8f0; text-align: center; }
    h1 { margin-top: 0; font-size: 22px; color: #1e293b; }
    p { color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>ریستارت دستگاه</h1>
      <p>تنظیمات {{ 'مرکزی' if role == 'central' else 'سنسور' }} ذخیره شد. دستگاه به زودی ریبوت می‌شود.</p>
    </div>
  </div>
</body>
</html>
