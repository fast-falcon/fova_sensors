<!doctype html>
<html lang="fa" dir="rtl">
<head>

    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; color: #0f172a; padding: 24px; }
    .container { max-width: 640px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(15,23,42,0.08); border: 1px solid #e2e8f0; text-align: center; }
    h1 { margin-bottom: 12px; color: #1d4ed8; }
    p { color: #475569; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>ریستارت دستگاه</h1>
      <p>تنظیمات {{ 'مرکزی' if role == 'central' else 'سنسور' }} ذخیره شد.</p>
      <p>دستگاه در حال ریبوت است؛ چند لحظه منتظر بمانید.</p>
    </div>
  </div>
</body>
</html>
