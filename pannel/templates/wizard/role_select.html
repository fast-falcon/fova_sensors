<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>انتخاب نقش باکس</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#475569; --primary:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"IRANSans","Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); }
    .wizard-page { max-width:720px; margin:40px auto; padding:0 16px; }
    .wizard-card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 30px rgba(15,23,42,0.08); padding:20px; }
    .wizard-title { font-size:20px; font-weight:700; margin-bottom:8px; }
    .wizard-text { color:var(--muted); margin-bottom:16px; }
    .choice { padding:12px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; display:flex; align-items:center; gap:10px; background:#f8fafc; }
    .wizard-btn { background:var(--primary); color:#fff; padding:10px 18px; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
    .wizard-btn:hover { opacity:0.95; }
    .notice { padding:10px; border-radius:10px; background:#ecfeff; color:#0ea5e9; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="wizard-page">
    <div class="wizard-card">
      <div class="wizard-title">انتخاب نقش باکس</div>
      <div class="wizard-text">لطفاً مشخص کنید این دستگاه به عنوان باکس مرکزی یا سنسور عمل می‌کند.</div>
      {% if already_configured %}
        <div class="notice">پیکربندی قبلی یافت شد؛ در صورت نیاز می‌توانید نقش جدیدی انتخاب کنید.</div>
      {% endif %}
      <form method="post">
        <label class="choice">
          <input type="radio" name="role" value="central" required />
          <span>باکس مرکزی (مدیریت و جمع‌آوری اطلاعات سنسورها)</span>
        </label>
        <label class="choice">
          <input type="radio" name="role" value="sensor" required />
          <span>باکس سنسور (ارسال داده‌های محیطی به مرکز)</span>
        </label>
        <div style="margin-top:14px;">
          <button class="wizard-btn" type="submit">ادامه</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
