<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>انتخاب نقش باکس</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background:#f8fafc; color:#0f172a; margin:0; padding:30px; }
    .card { max-width: 640px; margin: 0 auto; background:white; padding:20px; border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,0.08); border:1px solid #e2e8f0; }
    h1 { margin-bottom: 12px; color:#1e293b; }
    p { color:#475569; }
    .field { margin:10px 0; padding:10px 12px; border:1px solid #e2e8f0; border-radius:12px; background:#f8fafc; }
    label { font-weight:600; color:#334155; }
    .button { margin-top:14px; padding:10px 16px; background:#2563eb; color:white; border:none; border-radius:10px; cursor:pointer; font-size:0.95em; }
    .button:hover { background:#1d4ed8; }
    .note { background:#ecfeff; border:1px solid #bae6fd; color:#075985; padding:10px 12px; border-radius:10px; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>انتخاب نقش</h1>
    {% if already_configured %}
      <div class="note">پیکربندی قبلی یافت شد؛ در صورت نیاز می‌توانید نقش جدیدی انتخاب کنید.</div>
    {% endif %}
    <form method="post">
      <div class="field">
        <label>
          <input type="radio" name="role" value="central" required /> باکس مرکزی
        </label>
      </div>
      <div class="field">
        <label>
          <input type="radio" name="role" value="sensor" required /> سنسور
        </label>
      </div>
      <button class="button" type="submit">ادامه</button>
    </form>
  </div>
</body>
</html>
