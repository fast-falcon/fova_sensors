{% extends "wizard/base.html" %}
{% block title %}انتخاب نقش باکس{% endblock %}
{% block content %}
  <h1>انتخاب نقش</h1>
  {% if already_configured %}
    <div class="alert">پیکربندی قبلی یافت شد؛ در صورت نیاز می‌توانید نقش جدیدی انتخاب کنید.</div>
  {% endif %}
  <form method="post">
    <label><input type="radio" name="role" value="central" required> باکس مرکزی</label>
    <label><input type="radio" name="role" value="sensor" required> سنسور</label>
    <div class="flex" style="margin-top:12px;">
      <button type="submit">ادامه</button>
    </div>
  </form>
{% endblock %}
