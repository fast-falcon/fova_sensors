<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>انتخاب نقش باکس</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
    .container { max-width: 760px; margin: 0 auto; padding: 28px; }
    .card { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(15,23,42,0.08); border: 1px solid #e2e8f0; }
    h1 { margin-top: 0; font-size: 22px; color: #1e293b; }
    p { color: #475569; }
    .option { margin: 12px 0; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; }
    .actions { margin-top: 16px; display: flex; justify-content: flex-end; }
    button { background: #22c55e; color: #ffffff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    button:hover { background: #16a34a; }
    .hint { background: #ecfeff; border: 1px solid #bae6fd; color: #0f172a; padding: 10px 12px; border-radius: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>انتخاب نقش</h1>
      {% if already_configured %}
        <div class="hint">پیکربندی قبلی یافت شد؛ در صورت نیاز می‌توانید نقش جدیدی انتخاب کنید.</div>
      {% endif %}
      <form method="post">
        <div class="option">
          <label><input type="radio" name="role" value="central" required /> باکس مرکزی</label>
        </div>
        <div class="option">
          <label><input type="radio" name="role" value="sensor" required /> سنسور</label>
        </div>
        <div class="actions"><button type="submit">ادامه</button></div>
      </form>
    </div>
  </div>
</body>
</html>
