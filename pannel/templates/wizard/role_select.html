<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>انتخاب نقش باکس</title>
</head>
<body>
  <h1>انتخاب نقش</h1>
  {% if already_configured %}
    <p style="color:green">پیکربندی قبلی یافت شد؛ در صورت نیاز می‌توانید نقش جدیدی انتخاب کنید.</p>
  {% endif %}
  <form method="post">
    <div>
      <label>
        <input type="radio" name="role" value="central" required /> باکس مرکزی
      </label>
    </div>
    <div>
      <label>
        <input type="radio" name="role" value="sensor" required /> سنسور
      </label>
    </div>
    <button type="submit">ادامه</button>
  </form>
</body>
</html>
