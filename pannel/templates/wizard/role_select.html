<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>انتخاب نقش باکس</title>
  <style>
    body { font-family: "IRANSans", "Vazir", "Segoe UI", sans-serif; background: linear-gradient(135deg,#0f172a,#0b1220); color:#0f172a; margin:0; padding:20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background:#f8fafc; border-radius:16px; padding:20px; box-shadow:0 12px 30px rgba(15,23,42,0.25); border:1px solid #e2e8f0; }
    h1 { margin-top:0; color:#0ea5e9; font-size:22px; }
    .note { color:green; margin-bottom:10px; }
    label { display:block; padding:10px; border:1px solid #cbd5e1; border-radius:12px; margin:8px 0; background:#e2e8f0; cursor:pointer; }
    input[type=radio] { margin-left:6px; }
    button { margin-top:14px; background:#0ea5e9; color:#f8fafc; border:none; padding:10px 18px; border-radius:12px; font-weight:700; cursor:pointer; }
    button:hover { background:#0284c7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>انتخاب نقش</h1>
      {% if already_configured %}
        <p class="note">پیکربندی قبلی یافت شد؛ در صورت نیاز می‌توانید نقش جدیدی انتخاب کنید.</p>
      {% endif %}
      <form method="post">
        <label>
          <input type="radio" name="role" value="central" required /> باکس مرکزی
        </label>
        <label>
          <input type="radio" name="role" value="sensor" required /> سنسور
        </label>
        <button type="submit">ادامه</button>
      </form>
    </div>
  </div>
</body>
</html>
